services:
  oracle:
    image: ${ORACLE_IMAGE:-container-registry.oracle.com/database/free:23.26.3.0}
    container_name: monkyforce-oracle
    restart: unless-stopped
    ports:
      - '1521:1521'
    environment:
      ORACLE_PWD: ${ORACLE_PWD:-OracleDev_2026}
      ORACLE_CHARACTERSET: AL32UTF8
      APP_DB_USERNAME: ${APP_DB_USERNAME:-MONKYFORCE}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-MonkyForceDev_2026}
    volumes:
      - oracle-data:/opt/oracle/oradata
      - ./docker/oracle/setup:/opt/oracle/scripts/startup:ro
    healthcheck:
      test:
        [
          'CMD-SHELL',
          "echo 'select 1 from dual;' | sqlplus -s system/${ORACLE_PWD:-OracleDev_2026}@//localhost:1521/FREE >/dev/null 2>&1",
        ]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 120s

volumes:
  oracle-data:
